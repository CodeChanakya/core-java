name: CI

on:
  push:
  pull_request:

jobs:
  check-programs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Keeps the downloaded jars between runs so Maven Central is not hit every time.
      - uses: actions/cache@v4
        with:
          path: |
            03-object-oriented-programming/09-junit-starter-lab/lib
            09-professional-java/*/lib
            capstones/*/lib
            capstones/*/reference/lib
            capstones/*/starter/lib
          key: jars-junit-1.11.4-derby-10.16.1.1
      - name: Compile and check every program
        run: bash scripts/check-all.sh
      - name: Run the tests of the Phase 9 project
        run: bash 09-professional-java/38-employee-database-management/run.sh --test
      - name: Run the tests of the capstones
        run: |
          for dir in capstones/*/; do
            echo "== $dir"
            bash "$dir/run.sh" --test
          done
      - name: Grade the Program 43 reference (expects 48 of 48) and compile the starter
        run: |
          bash capstones/43-library-management-system/reference/run.sh --grade
          bash capstones/43-library-management-system/starter/run.sh --compile

  maven:
    # Builds the Phase 9 projects and the capstones with real Maven, the way a team would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test the Maven projects
        run: |
          for dir in 09-professional-java/3[5-8]-*/; do
            echo "== $dir"
            mvn -B -q -f "$dir/pom.xml" verify
          done
          for dir in capstones/*/; do
            echo "== $dir"
            # Program 43 keeps its projects in reference/ and starter/. Only the reference is built: the starter fails its tests until you write it.
            pom="$dir/pom.xml"; [ -f "$pom" ] || pom="$dir/reference/pom.xml"
            mvn -B -q -f "$pom" verify
          done
