name: CI

on:
  push:
  pull_request:

jobs:
  check-programs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Keeps the JUnit jar between runs so Maven Central is not hit every time.
      - uses: actions/cache@v4
        with:
          path: 03-object-oriented-programming/09-junit-starter-lab/lib
          key: junit-console-1.11.4
      - name: Compile and check every program
        run: bash scripts/check-all.sh
