name: CI

on:
  push:
  pull_request:

jobs:
  check-programs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and check every program
        run: ./scripts/check-all.sh
