<text x="48" y="716" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C" letter-spacing="1.1">IF IT GOES WRONG</text>
<text x="48" y="739" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">A misspelt constant fails to compile, instead of</text>
<text x="48" y="758" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">silently never matching like a String would.</text>
<rect x="448" y="691" width="402" height="109" rx="12" fill="#F0FDFA" stroke="#5EEAD4"/>
<text x="466" y="716" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F766E" letter-spacing="1.1">FOR EXPERTS</text>
<text x="466" y="739" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">Enums replace stringly-typed state. static belongs</text>
<text x="466" y="758" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">to the class and final fixes a value; EnumMap is</text>
<text x="466" y="777" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">compact and ordered.</text>
