<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 966" width="880" height="966" role="img" aria-labelledby="t d">
<title id="t">Program 42 flow: Concurrent Order Processing System</title><desc id="d">Flow of Program 42, Concurrent Order Processing System: 1. Many orders arrive at the same moment; 2. Reserve the stock without a lock; 3. Charge the card, but not for ever; 4. Give the stock back when anything fails; 5. One result per order, in order</desc>
<rect width="880" height="966" rx="18" fill="#F8FAFC"/>
<clipPath id="c"><rect width="880" height="966" rx="18"/></clipPath>
<g clip-path="url(#c)">
<rect x="0" y="0" width="880" height="86" fill="#0E1726"/>
<rect x="0" y="86" width="880" height="5" fill="#B83A0E"/>
<text x="30" y="34" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F4A582" letter-spacing="1.2">PHASE 10 · CAPSTONES · PROGRAM 42 OF 43</text>
<text x="30" y="68" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Concurrent Order Processing System</text>
<rect x="30" y="112" width="820" height="76" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
<text x="50" y="135" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B83A0E" letter-spacing="1.1">IN EVERYDAY WORDS</text>
<text x="50" y="158" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-style="italic" fill="#1E293B">A busy shop counter with a stock cupboard that has one key, a card machine that is sometimes</text>
<text x="50" y="179" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-style="italic" fill="#1E293B">slow, and a clerk who sends the receipts.</text>
<text x="30" y="214" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#475569" letter-spacing="1.1">HOW IT FLOWS, STEP BY STEP</text>
<rect x="30" y="228" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="228" width="7" height="72" rx="3" fill="#334155"/>
<circle cx="73" cy="264.0" r="17" fill="#334155"/>
<text x="73" y="270.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="106" y="256" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Many orders arrive at the same moment</text>
<text x="106" y="278" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">Eight named orders, then a burst of forty buyers for three keyboards.</text>
<rect x="756" y="242" width="74" height="22" rx="11" fill="#334155" fill-opacity="0.12"/>
<text x="793" y="257" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">INPUT</text>
<text x="830" y="284" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">Main.java</text>
<path d="M73 303 L73 319 M67 313 L73 320 L79 313" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="324" width="820" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="324" width="7" height="90" rx="3" fill="#0F766E"/>
<circle cx="73" cy="369.0" r="17" fill="#0F766E"/>
<text x="73" y="375.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="106" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Reserve the stock without a lock</text>
<text x="106" y="374" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">compareAndSet on an AtomicInteger: two threads cannot both take the last</text>
<text x="106" y="392" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">item.</text>
<rect x="756" y="338" width="74" height="22" rx="11" fill="#0F766E" fill-opacity="0.12"/>
<text x="793" y="353" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="1">WORK</text>
<text x="830" y="398" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">Inventory.java</text>
<path d="M73 417 L73 433 M67 427 L73 434 L79 427" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="438" width="820" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="438" width="7" height="90" rx="3" fill="#B45309"/>
<circle cx="73" cy="483.0" r="17" fill="#B45309"/>
<text x="73" y="489.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="106" y="466" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Charge the card, but not for ever</text>
<text x="106" y="488" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">The gateway returns a future, and orTimeout cuts off one that never</text>
<text x="106" y="506" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">answers.</text>
<rect x="756" y="452" width="74" height="22" rx="11" fill="#B45309" fill-opacity="0.12"/>
<text x="793" y="467" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="1">CHECK</text>
<text x="830" y="512" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">OrderProcessor.java</text>
<path d="M73 531 L73 547 M67 541 L73 548 L79 541" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="552" width="820" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="552" width="7" height="90" rx="3" fill="#6D28D9"/>
<circle cx="73" cy="597.0" r="17" fill="#6D28D9"/>
<text x="73" y="603.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="106" y="580" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Give the stock back when anything fails</text>
<text x="106" y="602" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">Declined, error or timeout: the reservation is released, so sold plus left</text>
<text x="106" y="620" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">is constant.</text>
<rect x="756" y="566" width="74" height="22" rx="11" fill="#6D28D9" fill-opacity="0.12"/>
<text x="793" y="581" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="1">STORE</text>
<text x="830" y="626" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">OrderProcessor.java</text>
<path d="M73 645 L73 661 M67 655 L73 662 L79 655" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="666" width="820" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="666" width="7" height="90" rx="3" fill="#B83A0E"/>
<circle cx="73" cy="711.0" r="17" fill="#B83A0E"/>
<text x="73" y="717.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="106" y="694" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">One result per order, in order</text>
<text x="106" y="716" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">A failed email does not undo a paid order; the output is sorted so it</text>
<text x="106" y="734" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">never changes.</text>
<rect x="756" y="680" width="74" height="22" rx="11" fill="#B83A0E" fill-opacity="0.12"/>
<text x="793" y="695" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#B83A0E" text-anchor="middle" letter-spacing="1">RESULT</text>
<text x="830" y="740" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">expected-output.txt</text>
<rect x="30" y="784" width="402" height="128" rx="12" fill="#FEF2F2" stroke="#FCA5A5"/>
<text x="48" y="809" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C" letter-spacing="1.1">IF IT GOES WRONG</text>
<text x="48" y="832" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">Reading the stock, then writing it in a second</text>
<text x="48" y="851" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">step, lets two threads both sell the last item;</text>
<text x="48" y="870" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">and a future's failure disappears if nothing</text>
<text x="48" y="889" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">handles it.</text>
<rect x="448" y="784" width="402" height="128" rx="12" fill="#F0FDFA" stroke="#5EEAD4"/>
<text x="466" y="809" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F766E" letter-spacing="1.1">FOR EXPERTS</text>
<text x="466" y="832" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">Make the check and the change one atomic step, and</text>
<text x="466" y="851" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">give every chain an ending that handles failure.</text>
<circle cx="36" cy="938" r="6" fill="#334155"/>
<text x="48" y="942" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Input</text>
<circle cx="136" cy="938" r="6" fill="#0F766E"/>
<text x="148" y="942" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Work</text>
<circle cx="236" cy="938" r="6" fill="#B45309"/>
<text x="248" y="942" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Check</text>
<circle cx="336" cy="938" r="6" fill="#6D28D9"/>
<text x="348" y="942" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Store</text>
<circle cx="436" cy="938" r="6" fill="#B83A0E"/>
<text x="448" y="942" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Result</text>
<text x="850" y="942" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="end">CodeChanakya · Core Java</text>
