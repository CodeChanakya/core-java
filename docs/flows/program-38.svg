<text x="30" y="34" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F4A582" letter-spacing="1.2">PHASE 09 · PROFESSIONAL JAVA · PROGRAM 38 OF 43</text>
<text x="30" y="68" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Employee Database Management</text>
<rect x="30" y="112" width="820" height="76" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
<text x="50" y="135" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B83A0E" letter-spacing="1.1">IN EVERYDAY WORDS</text>
<text x="50" y="158" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-style="italic" fill="#1E293B">A staff register with a clerk, a filing cabinet and a rule book, each doing one job and never</text>
<text x="50" y="179" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-style="italic" fill="#1E293B">reaching into the others.</text>
<text x="30" y="214" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#475569" letter-spacing="1.1">HOW IT FLOWS, STEP BY STEP</text>
<rect x="30" y="228" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="228" width="7" height="72" rx="3" fill="#334155"/>
<circle cx="73" cy="264.0" r="17" fill="#334155"/>
<text x="73" y="270.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="106" y="256" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Hire, raise, move, terminate</text>
<text x="106" y="278" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">The service receives plain requests from Main.</text>
<rect x="756" y="242" width="74" height="22" rx="11" fill="#334155" fill-opacity="0.12"/>
<text x="793" y="257" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">INPUT</text>
<text x="830" y="284" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">Main.java</text>
<path d="M73 303 L73 319 M67 313 L73 320 L79 313" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="324" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="324" width="7" height="72" rx="3" fill="#B45309"/>
<circle cx="73" cy="360.0" r="17" fill="#B45309"/>
<text x="73" y="366.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="106" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">The rule book says yes or no</text>
<text x="106" y="374" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">Name, e-mail, minimum pay, raise cap, no future dates.</text>
<rect x="756" y="338" width="74" height="22" rx="11" fill="#B45309" fill-opacity="0.12"/>
<text x="793" y="353" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="1">CHECK</text>
<text x="830" y="380" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">EmployeeService.java</text>
<path d="M73 399 L73 415 M67 409 L73 416 L79 409" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="420" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="420" width="7" height="72" rx="3" fill="#6D28D9"/>
<circle cx="73" cy="456.0" r="17" fill="#6D28D9"/>
<text x="73" y="462.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="106" y="448" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">The repository stores the facts</text>
<text x="106" y="470" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">An interface with two implementations: a map and Derby.</text>
<rect x="756" y="434" width="74" height="22" rx="11" fill="#6D28D9" fill-opacity="0.12"/>
<text x="793" y="449" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="1">STORE</text>
<text x="830" y="476" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">EmployeeRepository.java</text>
<path d="M73 495 L73 511 M67 505 L73 512 L79 505" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="516" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="516" width="7" height="72" rx="3" fill="#0F766E"/>
<circle cx="73" cy="552.0" r="17" fill="#0F766E"/>
<text x="73" y="558.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="106" y="544" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">SQL does the counting</text>
<text x="106" y="566" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">GROUP BY gives headcount, payroll and highest pay per department.</text>
<rect x="756" y="530" width="74" height="22" rx="11" fill="#0F766E" fill-opacity="0.12"/>
<text x="793" y="545" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="1">WORK</text>
<text x="830" y="572" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">JdbcEmployeeRepository.java</text>
<path d="M73 591 L73 607 M67 601 L73 608 L79 601" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="612" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="612" width="7" height="72" rx="3" fill="#B83A0E"/>
<circle cx="73" cy="648.0" r="17" fill="#B83A0E"/>
<text x="73" y="654.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="106" y="640" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Department report and total payroll</text>
<text x="106" y="662" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">The same on every run, because the clock is fixed.</text>
<rect x="756" y="626" width="74" height="22" rx="11" fill="#B83A0E" fill-opacity="0.12"/>
<text x="793" y="641" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#B83A0E" text-anchor="middle" letter-spacing="1">RESULT</text>
<text x="830" y="668" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">expected-output.txt</text>
<rect x="30" y="712" width="402" height="128" rx="12" fill="#FEF2F2" stroke="#FCA5A5"/>
<text x="48" y="737" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C" letter-spacing="1.1">IF IT GOES WRONG</text>
<text x="48" y="760" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">A duplicate e-mail can slip past the service</text>
<text x="48" y="779" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">check, so the UNIQUE rule in the table backs it up</text>
<text x="48" y="798" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">and its SQLState is translated back.</text>
<rect x="448" y="712" width="402" height="128" rx="12" fill="#F0FDFA" stroke="#5EEAD4"/>
<text x="466" y="737" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F766E" letter-spacing="1.1">FOR EXPERTS</text>
<text x="466" y="760" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">Dependency injection of repository and Clock. One</text>
<text x="466" y="779" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">contract test class runs against every repository,</text>
<text x="466" y="798" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">which is Liskov substitution as an executable</text>
<text x="466" y="817" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">specification.</text>
