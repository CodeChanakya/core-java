<title id="t">Program 38 flow: Employee Database Management</title><desc id="d">Flow of Program 38, Employee Database Management: 1. Hire, raise, move, terminate; 2. The rule book says yes or no; 3. The repository stores the facts; 4. SQL does the counting; 5. Department report and total payroll</desc>
