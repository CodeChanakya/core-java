<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 893" width="880" height="893" role="img" aria-labelledby="t d">
<title id="t">Program 40 flow: E-commerce Order Management</title><desc id="d">Flow of Program 40, E-commerce Order Management: 1. Customers place orders; 2. Price the order with a list of offers; 3. Take the stock in one statement; 4. Move the order along its allowed steps; 5. Reports written as stream pipelines</desc>
<rect width="880" height="893" rx="18" fill="#F8FAFC"/>
<clipPath id="c"><rect width="880" height="893" rx="18"/></clipPath>
<g clip-path="url(#c)">
<rect x="0" y="0" width="880" height="86" fill="#0E1726"/>
<rect x="0" y="86" width="880" height="5" fill="#B83A0E"/>
<text x="30" y="34" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F4A582" letter-spacing="1.2">PHASE 10 · CAPSTONES · PROGRAM 40 OF 43</text>
<text x="30" y="68" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">E-commerce Order Management</text>
<rect x="30" y="112" width="820" height="76" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
<text x="50" y="135" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B83A0E" letter-spacing="1.1">IN EVERYDAY WORDS</text>
<text x="50" y="158" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-style="italic" fill="#1E293B">A warehouse with a till and a rule book: the last item sells once, every offer is a small card</text>
<text x="50" y="179" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-style="italic" fill="#1E293B">in a stack, and a parcel only moves forward.</text>
<text x="30" y="214" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#475569" letter-spacing="1.1">HOW IT FLOWS, STEP BY STEP</text>
<rect x="30" y="228" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="228" width="7" height="72" rx="3" fill="#334155"/>
<circle cx="73" cy="264.0" r="17" fill="#334155"/>
<text x="73" y="270.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="106" y="256" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Customers place orders</text>
<text x="106" y="278" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">Product codes and quantities, and sometimes a coupon.</text>
<rect x="756" y="242" width="74" height="22" rx="11" fill="#334155" fill-opacity="0.12"/>
<text x="793" y="257" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">INPUT</text>
<text x="830" y="284" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">Main.java</text>
<path d="M73 303 L73 319 M67 313 L73 320 L79 313" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="324" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="324" width="7" height="72" rx="3" fill="#0F766E"/>
<circle cx="73" cy="360.0" r="17" fill="#0F766E"/>
<text x="73" y="366.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="106" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Price the order with a list of offers</text>
<text x="106" y="374" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">Each DiscountPolicy is one lambda, and the service adds them up.</text>
<rect x="756" y="338" width="74" height="22" rx="11" fill="#0F766E" fill-opacity="0.12"/>
<text x="793" y="353" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="1">WORK</text>
<text x="830" y="380" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">Discounts.java</text>
<path d="M73 399 L73 415 M67 409 L73 416 L79 409" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="420" width="820" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="420" width="7" height="90" rx="3" fill="#B45309"/>
<circle cx="73" cy="465.0" r="17" fill="#B45309"/>
<text x="73" y="471.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="106" y="448" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Take the stock in one statement</text>
<text x="106" y="470" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">UPDATE ... WHERE stock &gt;= ? checks and changes together, inside one</text>
<text x="106" y="488" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">transaction.</text>
<rect x="756" y="434" width="74" height="22" rx="11" fill="#B45309" fill-opacity="0.12"/>
<text x="793" y="449" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="1">CHECK</text>
<text x="830" y="494" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">JdbcShopStore.java</text>
<path d="M73 513 L73 529 M67 523 L73 530 L79 523" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="534" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="534" width="7" height="72" rx="3" fill="#0F766E"/>
<circle cx="73" cy="570.0" r="17" fill="#0F766E"/>
<text x="73" y="576.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="106" y="562" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Move the order along its allowed steps</text>
<text x="106" y="584" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">OrderStatus says what may come next, and a gateway takes payment.</text>
<rect x="756" y="548" width="74" height="22" rx="11" fill="#0F766E" fill-opacity="0.12"/>
<text x="793" y="563" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="1">WORK</text>
<text x="830" y="590" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">OrderStatus.java</text>
<path d="M73 609 L73 625 M67 619 L73 626 L79 619" stroke="#94A3B8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="630" width="820" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="30" y="630" width="7" height="72" rx="3" fill="#B83A0E"/>
<circle cx="73" cy="666.0" r="17" fill="#B83A0E"/>
<text x="73" y="672.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="106" y="658" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Reports written as stream pipelines</text>
<text x="106" y="680" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#475569">Revenue by category, best sellers, top customers, in a fixed order.</text>
<rect x="756" y="644" width="74" height="22" rx="11" fill="#B83A0E" fill-opacity="0.12"/>
<text x="793" y="659" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#B83A0E" text-anchor="middle" letter-spacing="1">RESULT</text>
<text x="830" y="686" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748B" text-anchor="end">Reports.java</text>
<rect x="30" y="730" width="402" height="109" rx="12" fill="#FEF2F2" stroke="#FCA5A5"/>
<text x="48" y="755" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C" letter-spacing="1.1">IF IT GOES WRONG</text>
<text x="48" y="778" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">A stock check done as a separate step lets two</text>
<text x="48" y="797" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">buyers take the last item, and a stream cannot be</text>
<text x="48" y="816" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#450A0A">used a second time.</text>
<rect x="448" y="730" width="402" height="109" rx="12" fill="#F0FDFA" stroke="#5EEAD4"/>
<text x="466" y="755" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F766E" letter-spacing="1.1">FOR EXPERTS</text>
<text x="466" y="778" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">Strategy by interface keeps offers out of the</text>
<text x="466" y="797" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">order code. Reports are pure functions of a list,</text>
<text x="466" y="816" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.2" fill="#042F2E">so they are tested with no database.</text>
<circle cx="36" cy="865" r="6" fill="#334155"/>
<text x="48" y="869" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Input</text>
<circle cx="136" cy="865" r="6" fill="#0F766E"/>
<text x="148" y="869" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Work</text>
<circle cx="236" cy="865" r="6" fill="#B45309"/>
<text x="248" y="869" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Check</text>
<circle cx="336" cy="865" r="6" fill="#6D28D9"/>
<text x="348" y="869" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Store</text>
<circle cx="436" cy="865" r="6" fill="#B83A0E"/>
<text x="448" y="869" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Result</text>
<text x="850" y="869" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="end">CodeChanakya · Core Java</text>
</g>
